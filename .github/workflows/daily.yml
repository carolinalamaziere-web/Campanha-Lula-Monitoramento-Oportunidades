name: Agente Diário do War Room

on:
  schedule:
    # 10:05 UTC = 07:05 em Brasília.
    - cron: "5 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualiza-painel-ao-vivo
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          # Usa o PAT quando existir e cai no token nativo do Actions nas
          # execuções agendadas. Isso evita a falha "token not supplied".
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Atualizar fontes auxiliares
        env:
          CONTENT_SOURCE: ${{ vars.CONTENT_SOURCE }}
          GOOGLE_SHEETS_ID: ${{ vars.GOOGLE_SHEETS_ID }}
          GOOGLE_SHEETS_RANGE: ${{ vars.GOOGLE_SHEETS_RANGE }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_TABLE: ${{ vars.SUPABASE_TABLE }}
        run: node scripts/atualiza-dados.js

      - name: Coletar dados reais da Meta dos últimos 28 dias
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_REQUIRED: "true"
          META_IG_USER_ID: ${{ vars.META_IG_USER_ID }}
          META_FACEBOOK_PAGE_IDS: ${{ vars.META_FACEBOOK_PAGE_IDS }}
          META_INSTAGRAM_USERNAMES: ${{ vars.META_INSTAGRAM_USERNAMES }}
          META_LULA_ACCOUNTS: ${{ vars.META_LULA_ACCOUNTS }}
          META_BOLSONARO_ACCOUNTS: ${{ vars.META_BOLSONARO_ACCOUNTS }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
          META_GRAPH_FETCH_LIMIT: ${{ vars.META_GRAPH_FETCH_LIMIT }}
          META_GRAPH_TOP_LIMIT: ${{ vars.META_GRAPH_TOP_LIMIT }}
          META_TRENDING_DAYS: "28"
        run: node scripts/atualiza-meta-graph.js

      - name: Gerar relatório e conteúdos com OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.MODEL_API_KEY }}
          OPENAI_REPORT_MODEL: ${{ vars.OPENAI_REPORT_MODEL }}
          REPORT_DAYS: "28"
        run: node scripts/gera-relatorio-diario.js

      - name: Publicar dados atualizados
        id: publicar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: atualiza painel ao vivo"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Acionar deploy do Netlify
        if: steps.publicar.outputs.changed == 'true'
        env:
          NETLIFY_HOOK: ${{ secrets.NETLIFY_HOOK }}
        shell: bash
        run: |
          if [ -z "$NETLIFY_HOOK" ]; then
            echo "::warning::NETLIFY_HOOK não configurado; o push ainda pode acionar o deploy conectado ao Git."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$NETLIFY_HOOK"
