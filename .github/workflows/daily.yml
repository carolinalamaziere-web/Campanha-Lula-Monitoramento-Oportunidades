name: Atualiza Painel ao Vivo

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualiza-painel-ao-vivo
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Buscar dados e gerar roteiro
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONTENT_SOURCE: ${{ vars.CONTENT_SOURCE }}
          GOOGLE_SHEETS_ID: ${{ vars.GOOGLE_SHEETS_ID }}
          GOOGLE_SHEETS_RANGE: ${{ vars.GOOGLE_SHEETS_RANGE }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_TABLE: ${{ vars.SUPABASE_TABLE }}
        run: node scripts/atualiza-dados.js

      - name: Atualizar conteúdos da Meta Graph API
        continue-on-error: true
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ vars.META_IG_USER_ID }}
          META_FACEBOOK_PAGE_IDS: ${{ vars.META_FACEBOOK_PAGE_IDS }}
          META_INSTAGRAM_USERNAMES: ${{ vars.META_INSTAGRAM_USERNAMES }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
          META_GRAPH_FETCH_LIMIT: ${{ vars.META_GRAPH_FETCH_LIMIT }}
          META_GRAPH_TOP_LIMIT: ${{ vars.META_GRAPH_TOP_LIMIT }}
        run: node scripts/atualiza-meta-graph.js

      - name: Publicar dados atualizados
        id: publicar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: atualiza painel ao vivo"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Acionar deploy do Netlify
        if: steps.publicar.outputs.changed == 'true'
        env:
          NETLIFY_HOOK: ${{ secrets.NETLIFY_HOOK }}
        shell: bash
        run: |
          if [ -z "$NETLIFY_HOOK" ]; then
            echo "::warning::NETLIFY_HOOK não configurado; o push ainda pode acionar o deploy conectado ao Git."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$NETLIFY_HOOK"
